[project]
name = "airflow_maintenance_dags"
version = "0.3.2"
description = "A series of DAGs to help maintain and clean up after the operations of an Airflow environment"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.isort]
balanced_wrapping = true
combine_as_imports = true
include_trailing_comma = true
known_third_party = ["airflow"]
line_length = 120
# Hanging Grid Grouped
multi_line_output=5

[project.urls]
"Homepage" = "https://github.com/oneaudience/airflow-maintenance-dags"

[build-system]
requires = ['setuptools>=61.0']
build-backend = "setuptools.build_meta"
